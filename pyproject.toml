[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-ai-trader"
version = "0.1.0"
description = "Read-only Binance USD-M Futures regime, signal, and evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Binance AI Trader"}]
dependencies = [
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "APScheduler>=3.10.0",
    "pytz>=2024.1",
]

[project.scripts]
binance-ai-trader = "binance_ai_trader.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
