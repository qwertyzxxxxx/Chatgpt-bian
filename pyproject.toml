[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-ai-trader"
version = "0.1.0"
description = "Read-only Binance USD-M Futures regime, signal, and evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Binance AI Trader"}]
dependencies = []

[project.scripts]
binance-ai-trader = "binance_ai_trader.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
